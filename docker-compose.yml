services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SATSEARCH_CLIP_DEVICE: cpu
      REMOTECLIP_CHECKPOINT_PATH: /app/models/RemoteCLIP-ViT-B-32.pt
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
